name: build-verify

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bin/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'bin/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout with full history for the version-bump guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - name: install
        run: npm ci

      - name: bin/gm-mcp-server.js is a fresh build of src/
        run: npm run verify-build

      - name: a src/ change ships with a bumped BUNDLE_VERSION and a rebuilt bundle
        if: github.event_name == 'push'
        run: node scripts/check-version-bump.mjs ${{ github.event.before }} ${{ github.sha }}

      - name: verb registry contract
        run: node scripts/verbs-witness.mjs
